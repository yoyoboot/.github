name: Build Rider images
run-name: Rider · ${{ github.event.client_payload.source_sha }} · ${{ github.event.client_payload.request.build_mode }}

on:
  repository_dispatch:
    types: [rider-build-request]

permissions: {}

jobs:
  validate-request:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.validate.outputs.source_sha }}
      source-ref: ${{ steps.validate.outputs.source_ref }}
      source-actor: ${{ steps.validate.outputs.source_actor }}
      source-event: ${{ steps.validate.outputs.source_event }}
      images: ${{ steps.validate.outputs.images }}
      build-mode: ${{ steps.validate.outputs.build_mode }}
    steps:
      - name: Check out public build scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate signed Rider request
        id: validate
        shell: bash
        env:
          DISPATCH_HMAC_SECRET: ${{ secrets.RIDER_DISPATCH_HMAC_SECRET }}
          PROTOCOL: ${{ github.event.client_payload.protocol }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          SOURCE_BEFORE_SHA: ${{ github.event.client_payload.source_before_sha }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          SOURCE_ACTOR: ${{ github.event.client_payload.request.source_actor }}
          SOURCE_EVENT: ${{ github.event.client_payload.request.source_event }}
          BUILD_INTENT: ${{ github.event.client_payload.request.build_intent }}
          BUILD_TARGET: ${{ github.event.client_payload.request.build_target }}
          BUILD_MODE: ${{ github.event.client_payload.request.build_mode }}
          ISSUED_AT: ${{ github.event.client_payload.issued_at }}
          NONCE: ${{ github.event.client_payload.nonce }}
          SIGNATURE: ${{ github.event.client_payload.signature }}
        run: python3 .github/scripts/rider/verify-request.py

  build-images:
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.validate-request.outputs.images) }}
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.validate-request.outputs.source-sha }}
      BUILD_MODE: ${{ needs.validate-request.outputs.build-mode }}
      IMAGE_SELECTION: ${{ matrix.image }}
    steps:
      - name: Check out public build scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out exact private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ltm0203/Knight-boss
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.RIDER_PRIVATE_SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Compile and build image
        id: build
        shell: bash
        run: bash .github/scripts/rider/build-images.sh "$IMAGE_SELECTION"
      - name: Log in for version upload
        if: ${{ env.BUILD_MODE == 'publish' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.RIDER_IMAGE_REGISTRY }}
          username: ${{ vars.RIDER_IMAGE_USERNAME }}
          password: ${{ secrets.RIDER_IMAGE_PASSWORD }}

      - name: Push version image
        id: push-version
        if: ${{ env.BUILD_MODE == 'publish' }}
        timeout-minutes: 26
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ vars.RIDER_IMAGE_REGISTRY }}
          IMAGE_REPOSITORY: ${{ vars.RIDER_IMAGE_REPOSITORY }}
          LOCAL_TAG: ${{ steps.build.outputs.local_tag }}
          VERSION_TAG: ${{ steps.build.outputs.version_tag }}
        run: |
          image="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}:${VERSION_TAG}"
          docker tag "$LOCAL_TAG" "$image"
          timeout_seconds=720
          for attempt in 1 2; do
            echo "Uploading $IMAGE_SELECTION (attempt $attempt/2, timeout ${timeout_seconds}s)"
            started=$SECONDS
            if timeout --kill-after=15s "$timeout_seconds" docker push "$image"; then
              printf '%s\n' "$VERSION_TAG" > "$RUNNER_TEMP/$IMAGE_SELECTION.txt"
              exit 0
            else
              status=$?
            fi
            if [[ "$attempt" == 1 ]]; then
              echo "::warning::Version upload exited with status $status. Retrying in 5 seconds."
              sleep 5
            fi
          done
          if (( status == 124 || (status == 137 && SECONDS - started >= timeout_seconds) )); then
            echo 'upload_result=timeout' >> "$GITHUB_OUTPUT"
            echo "::error::Version image upload timed out for $IMAGE_SELECTION."
          fi
          exit "$status"
      - name: Version image upload timed out
        if: ${{ failure() && steps.push-version.outputs.upload_result == 'timeout' }}
        shell: bash
        run: echo 'The version upload exhausted its time limit after retrying.'
      - name: Record published version
        if: ${{ env.BUILD_MODE == 'publish' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rider-version-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.txt
          if-no-files-found: error
          overwrite: true

  publish-images:
    needs: [validate-request, build-images]
    if: ${{ needs.validate-request.outputs.build-mode == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: rider-main-publish
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      updated-tags: ${{ steps.publish.outputs.updated_tags }}
      failed-tag: ${{ steps.publish.outputs.failed_tag }}
      current-source: ${{ steps.source.outputs.current }}
    env:
      SOURCE_SHA: ${{ needs.validate-request.outputs.source-sha }}
    steps:
      - name: Check current Rider main
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RIDER_PRIVATE_SOURCE_PAT }}
        run: |
          current_sha=$(gh api repos/ltm0203/Knight-boss/git/ref/heads/main --jq .object.sha)
          [[ "$current_sha" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$current_sha" == "$SOURCE_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Rider main has advanced; fixed tags were not updated.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out public build scripts
        if: ${{ steps.source.outputs.current == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect published versions
        if: ${{ steps.source.outputs.current == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rider-version-*
          merge-multiple: true
          path: ${{ runner.temp }}/rider-versions
      - name: Log in for fixed tag publication
        if: ${{ steps.source.outputs.current == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.RIDER_IMAGE_REGISTRY }}
          username: ${{ vars.RIDER_IMAGE_USERNAME }}
          password: ${{ secrets.RIDER_IMAGE_PASSWORD }}
      - name: Update fixed tags
        if: ${{ steps.source.outputs.current == 'true' }}
        id: publish
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ vars.RIDER_IMAGE_REGISTRY }}
          IMAGE_REPOSITORY: ${{ vars.RIDER_IMAGE_REPOSITORY }}
        run: bash .github/scripts/rider/publish-images.sh "$RUNNER_TEMP/rider-versions"

  summary:
    needs: [validate-request, build-images, publish-images]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public build scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Overall result
        shell: bash
        env:
          REQUEST_RESULT: ${{ needs.validate-request.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          BUILD_MODE: ${{ needs.validate-request.outputs.build-mode }}
          PUBLISH_RESULT: ${{ needs.publish-images.result }}
          CURRENT_SOURCE: ${{ needs.publish-images.outputs.current-source }}
        run: |
          fixed_tags="$PUBLISH_RESULT"
          if [[ "$CURRENT_SOURCE" == false ]]; then
            fixed_tags='skipped (Rider main advanced)'
          fi
          {
            echo '## Rider image build'
            echo "Request: ${REQUEST_RESULT}; image pipeline: ${BUILD_RESULT}; fixed tags: ${fixed_tags}"
            echo 'This workflow does not run automated tests or deploy services.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$REQUEST_RESULT" = success
          test "$BUILD_RESULT" = success
          if [[ "$BUILD_MODE" == publish ]]; then
            test "$PUBLISH_RESULT" = success
          fi
      - name: Notify Rider build result
        if: ${{ !cancelled() && needs.validate-request.result == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ needs.validate-request.outputs.source-ref }}
          SOURCE_ACTOR: ${{ needs.validate-request.outputs.source-actor }}
          SOURCE_EVENT: ${{ needs.validate-request.outputs.source-event }}
          SOURCE_SHA: ${{ needs.validate-request.outputs.source-sha }}
          BUILD_MODE: ${{ needs.validate-request.outputs.build-mode }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          PUBLISH_RESULT: ${{ needs.publish-images.result }}
          CURRENT_SOURCE: ${{ needs.publish-images.outputs.current-source }}
          UPDATED_TAGS: ${{ needs.publish-images.outputs.updated-tags }}
          FAILED_TAG: ${{ needs.publish-images.outputs.failed-tag }}
          NOTIFY_WEBHOOK: ${{ secrets.RIDER_BUILD_NOTIFY_WEBHOOK }}
          NOTIFY_SECRET: ${{ secrets.RIDER_BUILD_NOTIFY_SECRET }}
        run: python3 .github/scripts/rider/notify-result.py
